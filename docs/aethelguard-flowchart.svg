<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1700" viewBox="0 0 1600 1700" role="img" aria-labelledby="title description">
  <title id="title">Aethelguard system flowchart</title>
  <desc id="description">Flowchart showing Chrome extension URL and download checks, dashboard sign-in, administrator email verification, and unquarantine request review.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #e2e8f0; }
      .title { font-size: 34px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-size: 16px; fill: #94a3b8; }
      .lane-title { font-size: 21px; font-weight: 700; fill: #f8fafc; }
      .label { font-size: 16px; font-weight: 600; }
      .small { font-size: 14px; fill: #cbd5e1; }
      .edge-label { font-size: 13px; font-weight: 600; fill: #cbd5e1; }
      .box { fill: #172554; stroke: #60a5fa; stroke-width: 2; }
      .green { fill: #064e3b; stroke: #34d399; stroke-width: 2; }
      .purple { fill: #3b0764; stroke: #c084fc; stroke-width: 2; }
      .amber { fill: #78350f; stroke: #fbbf24; stroke-width: 2; }
      .red { fill: #7f1d1d; stroke: #f87171; stroke-width: 2; }
      .lane { fill: #0f172a; stroke: #334155; stroke-width: 2; }
      .connector { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
      .divider { stroke: #334155; stroke-width: 1.5; stroke-dasharray: 8 8; }
      .decision { fill: #1e293b; stroke: #a78bfa; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1600" height="1700" fill="#020617"/>
  <text x="800" y="58" text-anchor="middle" class="title">Aethelguard System Flowchart</text>
  <text x="800" y="88" text-anchor="middle" class="subtitle">Chrome protection, account access, and quarantine request review</text>

  <rect x="40" y="115" width="740" height="1545" rx="22" class="lane"/>
  <rect x="820" y="115" width="740" height="1545" rx="22" class="lane"/>
  <text x="410" y="153" text-anchor="middle" class="lane-title">Chrome extension protection</text>
  <text x="1190" y="153" text-anchor="middle" class="lane-title">Web dashboard and review</text>
  <line x1="800" y1="125" x2="800" y2="1650" class="divider"/>

  <!-- Extension sign-in and monitoring -->
  <rect x="275" y="185" width="270" height="66" rx="13" class="green"/>
  <text x="410" y="225" text-anchor="middle" class="label">Sign in to extension</text>
  <path d="M410 251 V278" class="connector"/>
  <polygon points="410,278 500,326 410,374 320,326" class="decision"/>
  <text x="410" y="321" text-anchor="middle" class="small">Supabase</text>
  <text x="410" y="340" text-anchor="middle" class="small">sign-in succeeds?</text>
  <path d="M320 326 H165 V395" class="connector"/>
  <text x="233" y="315" text-anchor="middle" class="edge-label">No</text>
  <rect x="75" y="395" width="180" height="62" rx="12" class="red"/>
  <text x="165" y="433" text-anchor="middle" class="label">Show sign-in error</text>
  <path d="M410 374 V395" class="connector"/>
  <text x="428" y="390" class="edge-label">Yes</text>
  <rect x="275" y="395" width="270" height="62" rx="12" class="box"/>
  <text x="410" y="433" text-anchor="middle" class="label">Monitor pages and downloads</text>
  <path d="M410 457 V486" class="connector"/>
  <polygon points="410,486 500,534 410,582 320,534" class="decision"/>
  <text x="410" y="529" text-anchor="middle" class="small">Event type?</text>
  <text x="410" y="548" text-anchor="middle" class="small">URL or download</text>

  <!-- URL reputation path -->
  <path d="M320 534 H190 V604" class="connector"/>
  <text x="246" y="523" text-anchor="middle" class="edge-label">URL</text>
  <rect x="70" y="604" width="240" height="72" rx="12" class="box"/>
  <text x="190" y="634" text-anchor="middle" class="label">Send public URL</text>
  <text x="190" y="655" text-anchor="middle" class="small">to Aethelguard API</text>
  <path d="M190 676 V707" class="connector"/>
  <rect x="70" y="707" width="240" height="72" rx="12" class="purple"/>
  <text x="190" y="737" text-anchor="middle" class="label">Check VirusTotal</text>
  <text x="190" y="758" text-anchor="middle" class="small">existing URL report</text>
  <path d="M190 779 V810" class="connector"/>
  <rect x="70" y="810" width="240" height="72" rx="12" class="green"/>
  <text x="190" y="840" text-anchor="middle" class="label">Show URL reputation</text>
  <text x="190" y="861" text-anchor="middle" class="small">in Chrome</text>

  <!-- Download reputation path -->
  <path d="M500 534 H625 V604" class="connector"/>
  <text x="568" y="523" text-anchor="middle" class="edge-label">Download</text>
  <rect x="500" y="604" width="250" height="72" rx="12" class="green"/>
  <text x="625" y="634" text-anchor="middle" class="label">Hash file locally</text>
  <text x="625" y="655" text-anchor="middle" class="small">file contents stay on device</text>
  <path d="M625 676 V707" class="connector"/>
  <rect x="500" y="707" width="250" height="72" rx="12" class="box"/>
  <text x="625" y="737" text-anchor="middle" class="label">Send hash to API</text>
  <text x="625" y="758" text-anchor="middle" class="small">look up VirusTotal report</text>
  <path d="M625 779 V806" class="connector"/>
  <polygon points="625,806 715,854 625,902 535,854" class="decision"/>
  <text x="625" y="849" text-anchor="middle" class="small">Any malicious</text>
  <text x="625" y="868" text-anchor="middle" class="small">verdicts?</text>

  <path d="M535 854 H465 V933" class="connector"/>
  <text x="493" y="843" text-anchor="middle" class="edge-label">Yes</text>
  <rect x="345" y="933" width="240" height="72" rx="12" class="amber"/>
  <text x="465" y="963" text-anchor="middle" class="label">Verify and quarantine</text>
  <text x="465" y="984" text-anchor="middle" class="small">file locally on Windows</text>
  <path d="M465 1005 V1034" class="connector"/>
  <rect x="345" y="1034" width="240" height="72" rx="12" class="box"/>
  <text x="465" y="1064" text-anchor="middle" class="label">Record incident</text>
  <text x="465" y="1085" text-anchor="middle" class="small">after quarantine succeeds</text>
  <path d="M465 1106 V1135" class="connector"/>
  <rect x="345" y="1135" width="240" height="62" rx="12" class="green"/>
  <text x="465" y="1173" text-anchor="middle" class="label">Notify user</text>

  <path d="M625 902 V933" class="connector"/>
  <text x="644" y="924" class="edge-label">No</text>
  <polygon points="625,933 715,981 625,1029 535,981" class="decision"/>
  <text x="625" y="976" text-anchor="middle" class="small">Any suspicious</text>
  <text x="625" y="995" text-anchor="middle" class="small">verdicts?</text>
  <path d="M535 981 H465 V1232" class="connector"/>
  <text x="493" y="970" text-anchor="middle" class="edge-label">Yes</text>
  <rect x="345" y="1232" width="240" height="72" rx="12" class="amber"/>
  <text x="465" y="1262" text-anchor="middle" class="label">Warn user</text>
  <text x="465" y="1283" text-anchor="middle" class="small">leave file in Downloads</text>
  <path d="M625 1029 V1080 H680 V1232" class="connector"/>
  <text x="647" y="1069" class="edge-label">No / no report</text>
  <rect x="590" y="1232" width="160" height="72" rx="12" class="box"/>
  <text x="670" y="1262" text-anchor="middle" class="label">Unrated</text>
  <text x="670" y="1283" text-anchor="middle" class="small">leave unchanged</text>
  <text x="410" y="1382" text-anchor="middle" class="subtitle">Unknown or suspicious results never mean “safe.”</text>

  <!-- Dashboard sign-in and role routing -->
  <rect x="1055" y="185" width="270" height="66" rx="13" class="green"/>
  <text x="1190" y="225" text-anchor="middle" class="label">Sign in to web app</text>
  <path d="M1190 251 V278" class="connector"/>
  <polygon points="1190,278 1280,326 1190,374 1100,326" class="decision"/>
  <text x="1190" y="321" text-anchor="middle" class="small">Supabase</text>
  <text x="1190" y="340" text-anchor="middle" class="small">sign-in succeeds?</text>
  <path d="M1100 326 H930 V395" class="connector"/>
  <text x="1010" y="315" text-anchor="middle" class="edge-label">No</text>
  <rect x="840" y="395" width="180" height="62" rx="12" class="red"/>
  <text x="930" y="433" text-anchor="middle" class="label">Show sign-in error</text>
  <path d="M1190 374 V395" class="connector"/>
  <text x="1208" y="390" class="edge-label">Yes</text>
  <polygon points="1190,395 1280,443 1190,491 1100,443" class="decision"/>
  <text x="1190" y="438" text-anchor="middle" class="small">Administrator</text>
  <text x="1190" y="457" text-anchor="middle" class="small">account?</text>

  <!-- Administrator MFA -->
  <path d="M1100 443 H930 V520" class="connector"/>
  <text x="1010" y="432" text-anchor="middle" class="edge-label">Yes</text>
  <rect x="840" y="520" width="180" height="72" rx="12" class="purple"/>
  <text x="930" y="550" text-anchor="middle" class="label">Send email code</text>
  <text x="930" y="571" text-anchor="middle" class="small">one-time verification</text>
  <path d="M930 592 V623" class="connector"/>
  <polygon points="930,623 1015,669 930,715 845,669" class="decision"/>
  <text x="930" y="664" text-anchor="middle" class="small">Code verified?</text>
  <path d="M845 669 H835 V762" class="connector"/>
  <text x="851" y="650" class="edge-label">No</text>
  <rect x="835" y="762" width="190" height="62" rx="12" class="red"/>
  <text x="930" y="800" text-anchor="middle" class="label">Show verification error</text>
  <path d="M930 715 V855" class="connector"/>
  <text x="948" y="746" class="edge-label">Yes</text>
  <rect x="840" y="855" width="180" height="72" rx="12" class="green"/>
  <text x="930" y="897" text-anchor="middle" class="label">Admin dashboard</text>

  <!-- User dashboard -->
  <path d="M1280 443 H1450 V520" class="connector"/>
  <text x="1364" y="432" text-anchor="middle" class="edge-label">No</text>
  <rect x="1340" y="520" width="220" height="72" rx="12" class="green"/>
  <text x="1450" y="562" text-anchor="middle" class="label">User dashboard</text>
  <path d="M1450 592 V623" class="connector"/>
  <polygon points="1450,623 1540,671 1450,719 1360,671" class="decision"/>
  <text x="1450" y="666" text-anchor="middle" class="small">Request release</text>
  <text x="1450" y="685" text-anchor="middle" class="small">of a file?</text>
  <path d="M1360 671 H1225 V762" class="connector"/>
  <text x="1288" y="660" text-anchor="middle" class="edge-label">No</text>
  <rect x="1110" y="762" width="230" height="72" rx="12" class="box"/>
  <text x="1225" y="792" text-anchor="middle" class="label">View account and</text>
  <text x="1225" y="813" text-anchor="middle" class="small">quarantine information</text>
  <path d="M1450 719 V762" class="connector"/>
  <text x="1468" y="746" class="edge-label">Yes</text>
  <rect x="1340" y="762" width="220" height="72" rx="12" class="box"/>
  <text x="1450" y="792" text-anchor="middle" class="label">Submit unquarantine</text>
  <text x="1450" y="813" text-anchor="middle" class="small">request</text>
  <path d="M1450 834 V884 H1250 V927" class="connector"/>

  <!-- Review and decision -->
  <rect x="1110" y="927" width="280" height="68" rx="12" class="box"/>
  <text x="1250" y="968" text-anchor="middle" class="label">Administrator reviews request</text>
  <path d="M1020 891 H1070 V961 H1110" class="connector"/>
  <text x="1060" y="880" text-anchor="middle" class="edge-label">Review</text>
  <path d="M1250 995 V1027" class="connector"/>
  <polygon points="1250,1027 1340,1075 1250,1123 1160,1075" class="decision"/>
  <text x="1250" y="1070" text-anchor="middle" class="small">Approve</text>
  <text x="1250" y="1089" text-anchor="middle" class="small">request?</text>
  <path d="M1160 1075 H1065 V1170" class="connector"/>
  <text x="1100" y="1064" text-anchor="middle" class="edge-label">Yes</text>
  <rect x="950" y="1170" width="230" height="72" rx="12" class="green"/>
  <text x="1065" y="1200" text-anchor="middle" class="label">Record approval</text>
  <text x="1065" y="1221" text-anchor="middle" class="small">mark incident released</text>
  <path d="M1340 1075 H1430 V1170" class="connector"/>
  <text x="1380" y="1064" text-anchor="middle" class="edge-label">No</text>
  <rect x="1315" y="1170" width="230" height="72" rx="12" class="amber"/>
  <text x="1430" y="1212" text-anchor="middle" class="label">Record rejection</text>
  <path d="M1065 1242 V1280 H1250 V1310" class="connector"/>
  <path d="M1430 1242 V1280 H1250" class="connector"/>
  <rect x="1135" y="1310" width="230" height="68" rx="12" class="box"/>
  <text x="1250" y="1351" text-anchor="middle" class="label">Update request status</text>
  <text x="1190" y="1440" text-anchor="middle" class="subtitle">Authentication and data are handled by Supabase.</text>
  <text x="1190" y="1467" text-anchor="middle" class="subtitle">Admin email codes are delivered by Resend.</text>

  <text x="800" y="1630" text-anchor="middle" class="subtitle">Aethelguard · System workflow</text>
</svg>
