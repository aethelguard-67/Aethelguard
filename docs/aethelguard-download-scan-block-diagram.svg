<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1500" viewBox="0 0 960 1500" role="img" aria-labelledby="title description">
  <title id="title">Aethelguard download scanning block diagram</title>
  <desc id="description">A vertical block diagram of local file hashing, VirusTotal reputation lookup, quarantine decisions, and Supabase incident monitoring.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #111; }
      .heading { font-size: 27px; font-weight: 700; }
      .box-text { font-size: 18px; }
      .small { font-size: 15px; }
      .branch { font-size: 15px; font-weight: 700; }
      .block { fill: #fff; stroke: #333; stroke-width: 2; }
      .decision { fill: #fff; stroke: #333; stroke-width: 2; }
      .line { fill: none; stroke: #333; stroke-width: 2; marker-end: url(#arrow); }
      .plain-line { fill: none; stroke: #333; stroke-width: 2; }
    </style>
  </defs>

  <rect width="960" height="1500" fill="#fff"/>
  <text x="480" y="45" text-anchor="middle" class="heading">Aethelguard Download Scanning</text>

  <rect x="245" y="75" width="470" height="82" rx="17" class="block"/>
  <text x="480" y="110" text-anchor="middle" class="box-text">
    <tspan x="480">Chrome detects a completed</tspan>
    <tspan x="480" dy="24">file download</tspan>
  </text>

  <path d="M480 157 V193" class="line"/>
  <rect x="245" y="195" width="470" height="82" rx="17" class="block"/>
  <text x="480" y="230" text-anchor="middle" class="box-text">
    <tspan x="480">Windows helper calculates the file's</tspan>
    <tspan x="480" dy="24">SHA-256 hash locally</tspan>
  </text>

  <path d="M480 277 V313" class="line"/>
  <rect x="245" y="315" width="470" height="100" rx="17" class="block"/>
  <text x="480" y="350" text-anchor="middle" class="box-text">
    <tspan x="480">Aethelguard API looks up the hash</tspan>
    <tspan x="480" dy="24">in VirusTotal and calculates a</tspan>
    <tspan x="480" dy="24">threat score from engine results</tspan>
  </text>

  <path d="M480 415 V445" class="line"/>
  <polygon points="480,445 625,510 480,575 335,510" class="decision"/>
  <text x="480" y="504" text-anchor="middle" class="box-text">
    <tspan x="480">Any malicious</tspan>
    <tspan x="480" dy="23">engine verdicts?</tspan>
  </text>

  <path d="M335 510 H195 V628" class="line"/>
  <text x="257" y="499" text-anchor="middle" class="branch">Yes</text>
  <polygon points="195,628 315,688 195,748 75,688" class="decision"/>
  <text x="195" y="681" text-anchor="middle" class="small">
    <tspan x="195">Is automatic</tspan>
    <tspan x="195" dy="20">quarantine enabled?</tspan>
  </text>

  <path d="M195 748 V787" class="line"/>
  <text x="214" y="775" class="branch">Yes</text>
  <rect x="45" y="790" width="300" height="88" rx="17" class="block"/>
  <text x="195" y="824" text-anchor="middle" class="box-text">
    <tspan x="195">Verify the hash again, then</tspan>
    <tspan x="195" dy="24">move the file to local quarantine</tspan>
  </text>

  <path d="M195 878 V913" class="line"/>
  <rect x="45" y="915" width="300" height="88" rx="17" class="block"/>
  <text x="195" y="949" text-anchor="middle" class="box-text">
    <tspan x="195">After quarantine succeeds,</tspan>
    <tspan x="195" dy="24">record the incident in Supabase</tspan>
  </text>

  <path d="M315 688 H430 V790" class="line"/>
  <text x="369" y="677" text-anchor="middle" class="branch">No</text>
  <rect x="365" y="790" width="260" height="88" rx="17" class="block"/>
  <text x="495" y="824" text-anchor="middle" class="box-text">
    <tspan x="495">Automatic move is disabled;</tspan>
    <tspan x="495" dy="24">file stays in Downloads</tspan>
  </text>

  <path d="M625 510 H765 V628" class="line"/>
  <text x="697" y="499" text-anchor="middle" class="branch">No</text>
  <polygon points="765,628 885,688 765,748 645,688" class="decision"/>
  <text x="765" y="681" text-anchor="middle" class="small">
    <tspan x="765">Any suspicious</tspan>
    <tspan x="765" dy="20">engine verdicts?</tspan>
  </text>

  <path d="M705 718 L640 790" class="line"/>
  <text x="661" y="743" text-anchor="middle" class="branch">Yes</text>
  <rect x="635" y="790" width="280" height="88" rx="17" class="block"/>
  <text x="775" y="824" text-anchor="middle" class="box-text">
    <tspan x="775">Warn the user; leave the</tspan>
    <tspan x="775" dy="24">file in Downloads</tspan>
  </text>

  <path d="M825 718 L850 913" class="line"/>
  <text x="862" y="815" class="branch">No / no report</text>
  <rect x="635" y="915" width="280" height="88" rx="17" class="block"/>
  <text x="775" y="949" text-anchor="middle" class="box-text">
    <tspan x="775">Show as unrated; leave</tspan>
    <tspan x="775" dy="24">the file unchanged</tspan>
  </text>

  <path d="M195 1003 V1070 H480 V1113" class="line"/>
  <rect x="245" y="1115" width="470" height="88" rx="17" class="block"/>
  <text x="480" y="1149" text-anchor="middle" class="box-text">
    <tspan x="480">Admin dashboard monitors recorded</tspan>
    <tspan x="480" dy="24">quarantine incidents and audit details</tspan>
  </text>

  <rect x="95" y="1250" width="770" height="145" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="480" y="1284" text-anchor="middle" class="small">
    <tspan x="480">Important:</tspan>
    <tspan x="480" dy="24">Files are hashed and quarantined on the Windows device;</tspan>
    <tspan x="480" dy="22">file contents are not uploaded. Suspicious-only or unknown results</tspan>
    <tspan x="480" dy="22">do not automatically quarantine a file. The threat score is an</tspan>
    <tspan x="480" dy="22">engine-consensus indicator, not a probability or a cutoff threshold.</tspan>
  </text>
</svg>
